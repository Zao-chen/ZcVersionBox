name: Build macOS
description: Qt 6.8.3 / macOS 12.0 Universal build and optional DMG packaging
inputs:
  package:
    description: Build and validate the macOS DMG
    required: false
    default: 'false'
  tag:
    description: Release tag used for package filenames
    required: false
    default: v0.1.0
  version:
    description: Numeric application version override
    required: false
    default: ''
  architectures:
    description: macOS application and SDK architectures
    required: false
    default: arm64;x86_64
runs:
  using: composite
  steps:
    - uses: seanmiddleditch/gha-setup-ninja@v5
    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        target: desktop
        arch: clang_64
        archives: qtbase qtsvg
        cache: true
    - name: Set up compiler cache
      if: ${{ inputs.package != 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Configure a clean Release build
      shell: bash
      env:
        TARGET_ARCHS: ${{ inputs.architectures }}
        PROJECT_VERSION: ${{ inputs.version }}
        CACHE_COMPILATION: ${{ inputs.package != 'true' }}
      run: |
        set -euo pipefail
        test ! -e build/release || { echo 'Use a clean build/release directory'; exit 1; }
        cmake_args=(
          -S .
          -B build/release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          "-DCMAKE_OSX_ARCHITECTURES=$TARGET_ARCHS"
        )
        if [[ "$CACHE_COMPILATION" == true ]]; then
          cmake_args+=(-DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
        fi
        if [[ -n "$PROJECT_VERSION" ]]; then
          cmake_args+=("-DZCVERSIONBOX_VERSION_OVERRIDE=$PROJECT_VERSION")
        fi
        cmake "${cmake_args[@]}"
    - name: Build
      shell: bash
      env:
        SCCACHE_GHA_ENABLED: 'true'
      run: |
        set -euo pipefail
        cmake --build build/release --parallel 4
    - name: Package macOS DMG
      if: ${{ inputs.package == 'true' }}
      shell: bash
      env:
        PACKAGE_TAG: ${{ inputs.tag }}
        TARGET_ARCHS: ${{ inputs.architectures }}
      run: bash scripts/package-macos.sh build/release dist/macos "$PACKAGE_TAG" "$TARGET_ARCHS"
    - uses: actions/upload-artifact@v4
      if: ${{ inputs.package == 'true' }}
      with:
        name: pkg-macos-dmg
        path: dist/macos/ZcVersionBox-*.dmg
        if-no-files-found: error
