name: Build and test Windows
description: Qt 6.8.3 / MSVC 2022 x64 build, tests and optional installer packaging
inputs:
  package:
    description: Build and validate the Windows installer
    required: false
    default: 'false'
  test-profile:
    description: Test scope (smoke, standard or full)
    required: false
    default: full
  tag:
    description: Release tag used for package filenames
    required: false
    default: v0.1.0
  version:
    description: Numeric application version override
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: seanmiddleditch/gha-setup-ninja@v5
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        target: desktop
        arch: win64_msvc2022_64
        archives: qtbase qtsvg
        cache: true
    - name: Set up compiler cache
      if: ${{ inputs.package != 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Configure a clean Release build
      shell: pwsh
      env:
        PROJECT_VERSION: ${{ inputs.version }}
        TEST_PROFILE: ${{ inputs.test-profile }}
        CACHE_COMPILATION: ${{ inputs.package != 'true' }}
      run: |
        if (Test-Path -LiteralPath build/release) { throw 'Use a clean build/release directory' }
        $cmakeArgs = @(
          '-S', '.',
          '-B', 'build/release',
          '-G', 'Ninja',
          '-DCMAKE_BUILD_TYPE=Release',
          '-DBUILD_TESTING=ON',
          "-DZCVERSIONBOX_TEST_PROFILE=$env:TEST_PROFILE",
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
        )
        if ($env:CACHE_COMPILATION -eq 'true') {
          $cmakeArgs += '-DCMAKE_CXX_COMPILER_LAUNCHER=sccache'
        }
        if ($env:PROJECT_VERSION) {
          $cmakeArgs += "-DZCVERSIONBOX_VERSION_OVERRIDE=$env:PROJECT_VERSION"
        }
        & cmake @cmakeArgs
        if ($LASTEXITCODE) { throw 'CMake configure failed' }
    - name: Build
      shell: pwsh
      env:
        SCCACHE_GHA_ENABLED: 'true'
      run: |
        cmake --build build/release --parallel 4
        if ($LASTEXITCODE) { throw 'Build failed' }
    - name: Test
      shell: pwsh
      run: |
        ctest --test-dir build/release --parallel 2 --output-on-failure
        if ($LASTEXITCODE) { throw 'Regression tests failed' }
    - name: Summarize test timings
      if: always()
      shell: pwsh
      run: python scripts/ci_report.py build/release/tests
    - name: Install Inno Setup
      if: ${{ inputs.package == 'true' }}
      shell: pwsh
      run: |
        if (!(Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and !(Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
        }
    - name: Package Windows installer
      if: ${{ inputs.package == 'true' }}
      shell: pwsh
      env:
        PACKAGE_TAG: ${{ inputs.tag }}
      run: ./scripts/package-windows.ps1 -BuildDirectory build/release -OutputDirectory dist/windows -Tag $env:PACKAGE_TAG
    - uses: actions/upload-artifact@v4
      if: ${{ inputs.package == 'true' }}
      with:
        name: pkg-windows-setup
        path: dist/ZcVersionBox-*-setup.exe
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        retention-days: 7
        name: tests-windows
        if-no-files-found: warn
        path: |
          build/release/Testing/Temporary/LastTest.log
          build/release/tests/*.txt
          build/release/tests/*.xml
