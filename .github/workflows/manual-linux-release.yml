name: Manual release (Linux)
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (example v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-linux
        with:
          tag: ${{ inputs.tag_name }}
  release:
    needs: build_linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-linux-deb
          path: release_assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ZcVersionBox ${{ inputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_assets/*.deb
