name: Manual Build+Package+Release (ZcVersionBox macOS)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (example: v1.0.0)"
        required: true
      qt_version:
        description: "Qt version"
        required: false
        default: "6.6.3"
      build_type:
        description: "CMake build type"
        required: false
        default: "Release"
      osx_arch:
        description: "macOS architectures (e.g. arm64 or arm64;x86_64)"
        required: false
        default: "arm64"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ inputs.qt_version }}
          target: desktop
          arch: clang_64
          cache: true

      - name: Verify 3rdparty macOS dylibs
        shell: bash
        run: |
          required=(
            "3rdparty/ZcAILib/lib/libZcAiLib.dylib"
            "3rdparty/ElaWidgetTools/lib/libElaWidgetTools.dylib"
            "3rdparty/ZcWidgetTools/lib/libZcWidgetTools.dylib"
          )

          missing=()
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              missing+=("$f")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required macOS dylibs:"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ inputs.osx_arch }}"

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Bundle app with macdeployqt
        shell: bash
        run: |
          app_path="build/ZcVersionBox.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Not found: $app_path"
            exit 1
          fi

          # install-qt-action 已将 Qt bin 目录加入 PATH，直接使用即可
          macdeployqt=$(which macdeployqt)
          if [[ ! -x "$macdeployqt" ]]; then
            echo "macdeployqt not found in PATH"
            exit 1
          fi
          echo "Using macdeployqt: $macdeployqt"

          "$macdeployqt" "$app_path" -verbose=1

      - name: Copy 3rdparty dylibs into bundle
        shell: bash
        run: |
          app_path="build/ZcVersionBox.app"
          frameworks_dir="$app_path/Contents/Frameworks"
          bin_path="$app_path/Contents/MacOS/ZcVersionBox"
          mkdir -p "$frameworks_dir"

          cp -f 3rdparty/ZcAILib/lib/libZcAiLib.dylib "$frameworks_dir/"
          cp -f 3rdparty/ElaWidgetTools/lib/libElaWidgetTools.dylib "$frameworks_dir/"
          cp -f 3rdparty/ZcWidgetTools/lib/libZcWidgetTools.dylib "$frameworks_dir/"

          for lib in "$frameworks_dir"/*.dylib; do
            install_name_tool -id "@rpath/$(basename "$lib")" "$lib"
          done

          install_name_tool -add_rpath "@executable_path/../Frameworks" "$bin_path" || true

      - name: Create DMG
        shell: bash
        run: |
          app_path="build/ZcVersionBox.app"
          dmg_name="ZcVersionBox-${{ inputs.tag_name }}-mac.dmg"

          if [[ -f "$dmg_name" ]]; then
            rm -f "$dmg_name"
          fi

          hdiutil create -volname "ZcVersionBox" -srcfolder "$app_path" -ov -format UDZO "$dmg_name"

      - name: Upload artifact (macOS dmg)
        uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-dmg
          path: ZcVersionBox-${{ inputs.tag_name }}-mac.dmg

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Generate release notes from commits
        shell: bash
        run: |
          current_tag="${{ inputs.tag_name }}"
          prev_tag="$(git tag --sort=-v:refname | grep -Fxv "$current_tag" | head -n 1)"

          if [ -n "$prev_tag" ]; then
            if git rev-parse "$current_tag" >/dev/null 2>&1; then
              commit_range="$prev_tag..$current_tag"
            else
              commit_range="$prev_tag..HEAD"
            fi
          else
            commit_range="HEAD"
          fi

          {
            echo "ZcVersionBox ${{ inputs.tag_name }}"
            echo
            echo "Built from commit: ${GITHUB_SHA}"
            echo
            echo "Recent commits:"
            if [ -n "$prev_tag" ]; then
              echo "(from $prev_tag to $current_tag)"
            else
              echo "(no previous tag found; showing current history)"
            fi
            git log $commit_range --pretty=format:'- %h %s (%an)'
          } > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ZcVersionBox ${{ inputs.tag_name }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: release_assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
