name: Manual release (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (example v1.0.0)
        required: true
      osx_arch:
        description: 'macOS architectures; SDK currently supports arm64 only'
        default: arm64
        required: true

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/build-windows
        with:
          tag: ${{ inputs.tag_name }}

  build_macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/build-macos
        with:
          tag: ${{ inputs.tag_name }}
          architectures: ${{ inputs.osx_arch }}

  release:
    needs: [build_windows, build_macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: release_assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ZcVersionBox ${{ inputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_assets/*
